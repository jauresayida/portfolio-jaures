<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#7b4421" />
    <title>404 — Page introuvable | Jaurès Ayida</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237b4421'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='32' font-weight='700' text-anchor='middle' fill='%23fff8f0'%3EJA%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #faf5ee; --surface: #fffdf9; --text: #2b1d14; --muted: #6b5a4c; --line: #e7dacb;
        --accent: #7b4421; --accent-2: #c0873f; --accent-soft: #f0e1d0; --on-accent: #fff8f0;
      }
      :root.dark {
        --bg: #16100c; --surface: #1f1611; --text: #f2e8dc; --muted: #b3a190; --line: #38291f;
        --accent: #e0a070; --accent-2: #f3c78f; --accent-soft: #2f2117; --on-accent: #1a0f08;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--text);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        background-image: radial-gradient(60rem 30rem at 85% -10%, var(--accent-soft), transparent 60%);
      }
      main { text-align: center; max-width: 34rem; }
      .robot { width: 150px; height: auto; display: block; margin: 0 auto; overflow: visible; }
      .float { animation: float 4s ease-in-out infinite; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: 60px 6px; }
      .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
      .qmark { animation: q 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .45; transform: scale(.8) } }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
      @keyframes q { 0%,100% { transform: rotate(-8deg) translateY(0) } 50% { transform: rotate(8deg) translateY(-5px) } }
      h1 {
        font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600;
        font-size: clamp(5rem, 22vw, 8rem); line-height: 1; letter-spacing: -.03em; margin-top: 12px;
        background: linear-gradient(100deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.6rem; margin-top: 8px; }
      p { color: var(--muted); line-height: 1.6; margin-top: 12px; }
      .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px;
        font-weight: 600; font-size: .9rem; text-decoration: none; transition: .2s;
      }
      a.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 24px -10px var(--accent); }
      a.primary:hover { transform: translateY(-2px); }
      a.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--text); }
      a.ghost:hover { border-color: var(--accent); color: var(--accent); }
      a:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
    <script>
      // Reprend le thème et la langue choisis sur le portfolio
      var lang = 'fr';
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        if (localStorage.getItem('lang') === 'en') lang = 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <main>
      <svg id="robot" class="robot" viewBox="0 0 120 134" role="img" aria-label="Robot">
        <g class="float">
          <line x1="60" y1="20" x2="60" y2="8" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" />
          <circle class="pulse" cx="60" cy="6" r="5" fill="var(--accent-2)" />
          <rect x="6" y="50" width="11" height="28" rx="5.5" fill="var(--accent)" />
          <rect x="103" y="50" width="11" height="28" rx="5.5" fill="var(--accent)" />
          <rect x="16" y="20" width="88" height="76" rx="24" fill="var(--surface)" stroke="var(--accent)" stroke-width="4" />
          <rect x="28" y="35" width="64" height="46" rx="16" fill="#1b120c" />
          <g id="eyes" style="transition: transform .15s ease-out">
            <rect class="eye" x="40" y="48" width="12" height="17" rx="6" fill="#f3c78f" />
            <rect class="eye" x="68" y="48" width="12" height="17" rx="6" fill="#f3c78f" />
          </g>
          <!-- bouche perplexe -->
          <path d="M52 74 Q56 70 60 74 T68 74" fill="none" stroke="#f3c78f" stroke-width="2.6" stroke-linecap="round" />
          <rect x="34" y="100" width="52" height="28" rx="13" fill="var(--accent)" />
          <circle cx="60" cy="114" r="4.5" fill="var(--accent-2)" />
          <!-- point d'interrogation -->
          <text class="qmark" x="104" y="18" font-family="Georgia, serif" font-size="26" font-weight="700" fill="var(--accent-2)">?</text>
        </g>
      </svg>

      <h1>404</h1>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="actions">
        <a class="btn primary" href="/" id="home"></a>
        <a class="btn ghost" href="/#projects" id="projects"></a>
      </div>
    </main>

    <script>
      var T = {
        fr: {
          title: 'Oups, page introuvable',
          text: 'Mon robot a cherché partout, mais cette page n’existe pas (ou a déménagé). Pas de panique : le reste du portfolio est juste là.',
          home: 'Retour à l’accueil',
          projects: 'Voir mes projets',
          doc: '404 — Page introuvable | Jaurès Ayida',
        },
        en: {
          title: 'Oops, page not found',
          text: 'My robot looked everywhere, but this page doesn’t exist (or has moved). Don’t worry: the rest of the portfolio is right here.',
          home: 'Back to home',
          projects: 'See my projects',
          doc: '404 — Page not found | Jaurès Ayida',
        },
      }[lang];
      document.documentElement.lang = lang;
      document.title = T.doc;
      document.getElementById('title').textContent = T.title;
      document.getElementById('text').textContent = T.text;
      document.getElementById('home').textContent = T.home;
      document.getElementById('projects').textContent = T.projects;

      // Les yeux du robot suivent le curseur
      var svg = document.getElementById('robot'), eyes = document.getElementById('eyes');
      window.addEventListener('pointermove', function (e) {
        var r = svg.getBoundingClientRect();
        var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * 0.45);
        var d = Math.hypot(dx, dy) || 1, m = Math.min(5, d / 30);
        eyes.style.transform = 'translate(' + (dx / d) * m + 'px,' + (dy / d) * m + 'px)';
      }, { passive: true });
    </script>
  </body>
</html>
